name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, host tests, release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Host-side tests
        run: cargo test

      - name: Build virtual board (release)
        run: cargo xtask build --release --board virtual

  boot:
    name: Boot ${{ matrix.board }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: virtual
            os: ubuntu-latest
            run: run
          # QEMU's raspi4b machine arrived in QEMU 9.0; Ubuntu 24.04 ships 8.2.
          # Switch this to ubuntu-latest once its apt QEMU is new enough.
          - board: raspberry-pi-4
            os: macos-latest
            run: run-raspberry-pi-4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: QEMU version
        run: qemu-system-aarch64 --version

      - name: Drop any cached firmware checkout
        if: matrix.board == 'raspberry-pi-4'
        run: rm -rf target/raspberry-pi-4/firmware

      - name: Build ${{ matrix.board }}
        run: cargo xtask build --board ${{ matrix.board }} --stress

      - name: Boot ${{ matrix.board }} and run the stress plan
        run: bash tools/ci/boot-test.sh "boot-${{ matrix.board }}.log" 120 cargo xtask ${{ matrix.run }} --stress

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ matrix.board }}
          path: boot-${{ matrix.board }}.log