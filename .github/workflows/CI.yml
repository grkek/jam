name: CI

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none-softfloat

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Run host-side tests (Foundation)
        run: cargo test

      - name: Build for AArch64 via xtask
        run: cargo xtask build

      - name: Run in QEMU (with timeout)
        run: |
          # Boots QEMU, waits 10 seconds for it to boot/print logs, 
          # then kills QEMU so the CI step can proceed.
          timeout --preserve-status 10s cargo xtask run || [ $? -eq 124 ]