name: CI

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none-softfloat

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Run host-side tests (Foundation)
        run: cargo test

      - name: Build for AArch64 via xtask
        run: cargo xtask build

      - name: Run in QEMU and Verify Boot
        run: |
          # Run QEMU with a timeout, capture output, and assert success
          set -o pipefail
          timeout 5s cargo xtask -- run 2>&1 | tee qemu.log || true
          
          # Verify that the kernel actually reached the "Done." state
          if grep -q "Done." qemu.log; then
            echo "Kernel booted and passed self-tests successfully!"
            exit 0
          else
            echo "Kernel failed to reach 'Done.' state."
            exit 1
          fi